name: Windows desktop client
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare bundled workbench
        shell: pwsh
        run: Copy-Item -Recurse docs desktop/app
      - name: Install desktop build dependencies
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build portable Windows client
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: exam-daily-windows-x64
          path: desktop/dist/*.exe
      - name: Publish desktop download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          $tag = "desktop-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "日日有进 Windows桌面版 $version" --notes "Windows x64便携版。透明无边框橘子桌宠，最小化切换，点击恢复，拖动移动，右键退出。首次使用请从网页导出完整备份并在客户端导入。未进行代码签名。"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem desktop/dist/*.exe | ForEach-Object { gh release upload $tag $_.FullName --clobber; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
